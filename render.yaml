services:
  - type: web
    name: nic-club-chat-backend
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm install --omit=dev && npm rebuild sqlite3
    startCommand: node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
